<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LustyBooks</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#F3F4F6;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px;
  box-sizing:border-box;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.progress-bar{
  height:8px;
  background:#E5E7EB;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress{
  height:100%;
  width:0%;
  background:#22C55E;
  transition:width 0.4s ease;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.options button{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:none;
  border-radius:10px;
  background:#FFF1F2;
  cursor:pointer;
  font-size:14px;
  transition:all 0.2s ease;
}

.options button:hover{
  background:#FECACA;
}

.loading{
  text-align:center;
  display:none;
}

.spinner{
  width:40px;
  height:40px;
  border:5px solid #E5E7EB;
  border-top:5px solid #10B981;
  border-radius:50%;
  margin:20px auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.final-page{
  display:none;
  text-align:center;
}

.btn{
  display:block;
  width:100%;
  padding:16px;
  margin-top:20px;
  background:#7acb00;
  color:#000;
  font-weight:bold;
  border-radius:12px;
  text-decoration:none;
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(122,203,0,0.6);}
  70% { box-shadow: 0 0 0 12px rgba(122,203,0,0);}
  100% { box-shadow: 0 0 0 0 rgba(122,203,0,0);}
}
</style>
</head>
<body>

<div class="container">

<div class="progress-bar">
  <div class="progress" id="progress"></div>
</div>

<div id="quiz"></div>

<div class="loading" id="loading">
  <h2>Selecionando histórias perfeitas para você...</h2>
  <div class="spinner"></div>
</div>

<div class="final-page" id="final">

  <h2>💖 Seu acesso personalizado está pronto!</h2>

  <p>Selecionamos as histórias mais envolventes para o seu perfil.</p>

  <!-- VIDEO SERÁ INSERIDO AQUI -->
  <div id="video-container"></div>

  <p style="margin-top:20px;">
  Tenha acesso ilimitado a romances intensos, emocionantes e envolventes.
  </p>

  <a href="https://app.mivvo.io/checkout/5yzlz8y0" class="btn">
    🔓 Quero acessar agora
  </a>

</div>

</div>

<script>
const questions = [
"Você gosta de histórias de romance?",
"O que mais te prende em uma história?",
"Você prefere histórias mais...",
"Com que frequência você lê romances?",
"Você já abandonou um livro por causa de capítulos pagos?",
"Você prefere ler no celular ou tablet?",
"Você gosta de personagens masculinos...",
"Quando começa uma história envolvente você...",
"Você prefere histórias curtas ou longas?",
"Se pudesse ter acesso ilimitado a romances envolventes..."
];

const answers = [
["Amo romances","Gosto bastante","Depende da história"],
["Paixão proibida","Homem dominante","Amor impossível"],
["Quentes e provocantes","Sensuais","Românticas"],
["Todos os dias","Algumas vezes por semana","Quando quero relaxar"],
["Sim","Já fiquei frustrada","Já gastei mais do que devia"],
["Celular","Tablet","Tanto faz"],
["Intensos","Poderosos","Sensíveis"],
["Não consigo parar","Fico ansiosa","Leio até tarde"],
["Longas","Intensas","Depende"],
["Leria todos os dias","Nunca mais compraria capítulos","Seria perfeito"]
];

let current = 0;

function showQuestion(){
  if(current < questions.length){
    document.getElementById("quiz").innerHTML =
      "<h2>"+questions[current]+"</h2><div class='options'>"+
      answers[current].map(a=>"<button onclick='next()'>"+a+"</button>").join("")+
      "</div>";
    updateProgress();
  } else {
    startLoading();
  }
}

function next(){
  current++;
  showQuestion();
}

function updateProgress(){
  document.getElementById("progress").style.width =
    ((current)/questions.length)*100+"%";
}

function startLoading(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("loading").style.display="block";

  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.getElementById("final").style.display="block";

    // Carregar VSL somente agora
    document.getElementById("video-container").innerHTML = `
      <vturb-smartplayer id="vid-68bb134df61d0cac8f68e5d6" 
      style="display:block;margin:0 auto;width:100%;max-width:400px;"></vturb-smartplayer>
    `;

    var s = document.createElement("script");
    s.src = "https://scripts.converteai.net/d531afe4-b51a-4140-ab3c-6ce52202a623/players/68bb134df61d0cac8f68e5d6/v4/player.js";
    s.async = true;
    document.head.appendChild(s);

  },8000);
}

showQuestion();
</script>

</body>
</html>
