<!DOCTYPE html>
<html lang="es">
  
<head>

<script>
  window.pixelId = "69fe5f564c5dc43cb369230a";
  var a = document.createElement("script");
  a.setAttribute("async", "");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Bíblico</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:92%;
max-width:480px;
}

.card{
background:#161616;
padding:30px;
border-radius:14px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
text-align:center;
}

h1{
font-size:24px;
margin-bottom:10px;
color:#f2b705;
}

p{
color:#cfcfcf;
}

.progress{
height:6px;
background:#333;
border-radius:10px;
margin-bottom:25px;
}

.bar{
height:6px;
background:#f2b705;
width:0%;
border-radius:10px;
transition:0.4s;
}

.option{
background:#222;
border-radius:10px;
padding:14px;
margin:10px 0;
cursor:pointer;
border:1px solid #f2b705;
transition:0.2s;
}

.option:hover{
background:#2a2a2a;
}

button{
background:#f2b705;
border:none;
padding:14px 22px;
border-radius:8px;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

.result{
font-size:22px;
color:#f2b705;
margin:15px 0;
}

.loader{
margin-top:20px;
}

.dot{
height:10px;
width:10px;
background:#f2b705;
border-radius:50%;
display:inline-block;
animation:blink 1.4s infinite both;
}

.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

@keyframes blink{
0%{opacity:.2}
20%{opacity:1}
100%{opacity:.2}
}
</style>

</head>

<body>

<div class="container">
<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="card" id="app"></div>
</div>

<script>

let step=0
let answers=[]

const questions=[

{
q:"¿Lees la Biblia… pero muchas veces no entiendes su verdadero significado?",
a:[
"Entiendo bien lo que leo",
"Entiendo algunas partes pero otras me confunden",
"Muchas veces no entiendo el contexto",
"Me cuesta comprender lo que significa"
]
},

{
q:"¿Qué es lo que más te gustaría entender?",
a:[
"El significado de los versículos",
"El contexto de las historias bíblicas",
"Cómo aplicar la Biblia en la vida diaria",
"El mensaje completo de la Biblia"
]
},

{
q:"Cuando encuentras un pasaje difícil en la Biblia...",
a:[
"Busco explicación en internet",
"Pregunto a alguien de la iglesia",
"Sigo leyendo aunque no entienda bien",
"A veces me frustra no entenderlo"
]
},

{
q:"Si existiera una guía simple para comprender la Biblia de forma clara y sencilla...",
a:[
"Me interesaría mucho",
"Me gustaría aprender cómo",
"Sería muy útil para mí",
"Quisiera saber más"
]
}

]

function updateBar(){
let percent=(step/questions.length)*100
document.getElementById("bar").style.width=percent+"%"
}

function showQuestion(){

let q=questions[step]

let html=`
<h1>Pregunta ${step+1} de 4</h1>
<p>${q.q}</p>
`

q.a.forEach((opt,i)=>{
html+=`<div class="option" onclick="answer(${i})">${opt}</div>`
})

document.getElementById("app").innerHTML=html

updateBar()

}

function answer(i){

answers.push(i)
step++

// Evento de engajamento (meio do quiz)
if(step === 2){
    fbq('track', 'ViewContent');
}

if(step<questions.length){
showQuestion()
}else{
showLoading()
}

}

function showLoading(){

document.getElementById("app").innerHTML=`

<h1>Analizando tus respuestas</h1>

<p>Cruzando referencias bíblicas</p>
<p>Evaluando comprensión espiritual</p>

<div class="loader">
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

`

setTimeout(showResult,3000)

}

function showResult(){

// 🔥 Evento forte de lead
fbq('track', 'Lead');

document.getElementById("bar").style.width="100%"

document.getElementById("app").innerHTML=`

<p style="color:#4CAF50;font-weight:bold;">
✔ Test completado
</p>

<p>Según tus respuestas...</p>

<h1>Tu diagnóstico bíblico es</h1>

<div class="result">Buscador de Entendimiento</div>

<p>
Lees la Biblia con fe y deseo de aprender,
pero muchas veces el significado profundo de los textos
no es completamente claro.
</p>

<p>
Por esta razón, muchas personas están utilizando una guía llamada
<b style="color:#f2b705;">CÓDIGO DIVINO</b>.
</p>

<p>
Una guía diseñada para ayudarte a comprender la Biblia
de forma clara y organizada.
</p>

<button onclick="goWhats()">QUIERO ENTENDER LA BIBLIA</button>

`

}

// 🔥 OTIMIZAÇÃO PRINCIPAL AQUI
function goWhats(){

console.log("Lead altamente qualificado");

// intenção de compra
fbq('track', 'InitiateCheckout');

// lead reforçado
fbq('track', 'Lead');

setTimeout(function(){
window.location.href="https://wa.me/556492265617?text=Quiero%20entender%20la%20Biblia"
}, 800);

}

showQuestion()

</script>

</body>
</html>
