<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Bíblico</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:92%;
max-width:480px;
}

.card{
background:#161616;
padding:30px;
border-radius:14px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
text-align:center;
}

h1{
font-size:24px;
margin-bottom:10px;
}

p{
color:#cfcfcf;
}

.progress{
height:6px;
background:#333;
border-radius:10px;
margin-bottom:25px;
}

.bar{
height:6px;
background:#f2b705;
width:0%;
border-radius:10px;
transition:0.4s;
}

.option{
background:#222;
border-radius:10px;
padding:14px;
margin:10px 0;
cursor:pointer;
border:1px solid #333;
}

.option:hover{
border:1px solid #f2b705;
}

button{
background:#f2b705;
border:none;
padding:14px 22px;
border-radius:8px;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

input{
width:90%;
padding:12px;
margin:8px;
border-radius:6px;
border:none;
font-size:16px;
}

.secure{
font-size:13px;
margin-top:10px;
color:#9f9f9f;
}

.error{
color:#ff6b6b;
font-size:14px;
margin-top:8px;
}

.result{
font-size:22px;
color:#f2b705;
margin:15px 0;
}

.loader{
margin-top:20px;
}

.dot{
height:10px;
width:10px;
background:#f2b705;
border-radius:50%;
display:inline-block;
animation:blink 1.4s infinite both;
}

.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

@keyframes blink{
0%{opacity:.2}
20%{opacity:1}
100%{opacity:.2}
}

</style>

</head>

<body>

<div class="container">

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="card" id="app">

<h1>Test de Comprensión Bíblica</h1>

<p>Descubre en 30 segundos tu nivel de comprensión de la Biblia.</p>

<p style="font-size:13px;">Más de 12.000 personas ya hicieron este test.</p>

<button onclick="startQuiz()">COMENZAR TEST</button>

</div>

</div>

<script>

let step=0
let answers=[]
let countryCode=""

const questions=[

{
q:"Cuando lees la Biblia normalmente...",
a:[
"Entiendo bien lo que leo",
"Entiendo algunas partes pero otras me confunden",
"Muchas veces no entiendo el contexto",
"Me cuesta comprender lo que significa"
]
},

{
q:"¿Qué es lo que más te gustaría entender?",
a:[
"El significado de los versículos",
"El contexto de las historias bíblicas",
"Cómo aplicar la Biblia en la vida diaria",
"El mensaje completo de la Biblia"
]
},

{
q:"Cuando encuentras un pasaje difícil...",
a:[
"Busco explicación en internet",
"Pregunto a alguien de la iglesia",
"Sigo leyendo aunque no entienda",
"Termino dejando esa parte"
]
},

{
q:"Si existiera una guía simple para entender la Biblia...",
a:[
"Me interesaría mucho",
"Tal vez la probaría",
"Dependería del contenido",
"No estoy seguro"
]
}

]

function updateBar(){
let percent=(step/questions.length)*100
document.getElementById("bar").style.width=percent+"%"
}

function startQuiz(){
showQuestion()
}

function showQuestion(){

let q=questions[step]

let html=`
<h1>Pregunta ${step+1} de 4</h1>
<p>${q.q}</p>
`

q.a.forEach((opt,i)=>{
html+=`<div class="option" onclick="answer(${i})">${opt}</div>`
})

document.getElementById("app").innerHTML=html

updateBar()

}

function answer(i){

answers.push(i)
step++

if(step<questions.length){
showQuestion()
}else{
showLoading()
}

}

function showLoading(){

document.getElementById("app").innerHTML=`

<h1>Analizando tus respuestas</h1>

<p>Cruzando referencias bíblicas</p>
<p>Evaluando comprensión espiritual</p>

<div class="loader">
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

`

setTimeout(showLead,3000)

}

function showLead(){

document.getElementById("bar").style.width="100%"

document.getElementById("app").innerHTML=`

<h1>Tu diagnóstico está listo</h1>

<p>Ingresa tu nombre y WhatsApp para ver tu diagnóstico.</p>

<input id="name" placeholder="Nombre">

<input id="phone" type="tel" placeholder="+52 5512345678" maxlength="15">

<div class="secure">
🔒 Tu número será usado solo para enviarte tu resultado.
</div>

<div id="error" class="error"></div>

<button onclick="sendLead()">VER MI RESULTADO</button>

`

detectCountry()

}

function detectCountry(){

let lang = navigator.language || navigator.userLanguage

let codes = {

"pt-BR":"+55",
"es-MX":"+52",
"es-AR":"+54",
"es-CL":"+56",
"es-CO":"+57",
"es-PE":"+51",
"es-VE":"+58",
"es-EC":"+593",
"es-BO":"+591",
"es-UY":"+598",
"es-PY":"+595",
"es-ES":"+34"

}

if(codes[lang]){
countryCode=codes[lang]
}

}

function sendLead(){

let name=document.getElementById("name").value.trim()
let phone=document.getElementById("phone").value.trim()
let error=document.getElementById("error")

error.innerHTML=""

let nameRegex=/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}$/

if(!nameRegex.test(name)){
error.innerHTML="Nombre inválido. Escribe solo letras."
return
}

let phoneRegexNumbers=/^[0-9]{10,15}$/
let phoneRegexFull=/^\+[0-9]{10,15}$/

if(phone.startsWith("+")){

if(!phoneRegexFull.test(phone)){
error.innerHTML="Número incorrecto. Ejemplo: +521234567890"
return
}

}else{

if(!phoneRegexNumbers.test(phone)){
error.innerHTML="Número incorrecto. Usa solo números."
return
}

if(countryCode===""){
error.innerHTML="Escribe tu número con código de país. Ejemplo: +521234567890"
return
}

}

let fullPhone=phone.startsWith("+") ? phone : countryCode+phone

fetch("https://script.google.com/macros/s/AKfycbz5FdZ_oE48PQIyxttsXMvb-GrxZkPreqnlM85hDc4FmDNJIWbTK4aEHYIlYMCyYp5irA/exec",{

method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name:name,
phone:fullPhone,
answers:answers
})

}).catch(err=>console.log(err))

showResult()

}

function showResult(){

document.getElementById("app").innerHTML=`

<h1>Tu diagnóstico bíblico</h1>

<div class="result">Nivel: Buscador de Entendimiento</div>

<p>Lees la Biblia con fe, pero muchas veces el significado profundo de los textos no es claro.</p>

<p>Muchas personas están utilizando una guía llamada <b>CÓDIGO DIVINO</b> para comprender la Biblia desde Génesis hasta Apocalipsis.</p>

<button onclick="goOffer()">VER CÓDIGO DIVINO</button>

`

}

function goOffer(){

window.location.href="LINK_HOSTINGER"

}

</script>

</body>
</html>
